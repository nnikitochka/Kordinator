helppopup.credentialsencryptionkey.text=\u0428\u0438\u0444\u0440\u0443\u0435\u0442 \u0432\u0441\u0435 \u043f\u0430\u0440\u043e\u043b\u0438 \u0441 \u043f\u043e\u043c\u043e\u0449\u044c\u044e \u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0449\u0438\u043a\u043e\u0432 \u043f\u0430\u0440\u043e\u043b\u0435\u0439 \u0441\u0442\u0438\u043b\u044f <code>encrypt</code>. \u0421\u043c\u0435\u043d\u0430 \u043f\u0430\u0440\u043e\u043b\u044f \u043a\u043b\u044e\u0447\u0430 \u0448\u0438\u0444\u0440\u043e\u0432\u0430\u043d\u0438\u044f \u0441\u0434\u0435\u043b\u0430\u0435\u0442 \u0432\u0441\u0435 \u0441\u0442\u0430\u0440\u044b\u0435 \u043f\u0430\u0440\u043e\u043b\u0438, \u0437\u0430\u0448\u0438\u0444\u0440\u043e\u0432\u0430\u043d\u043d\u044b\u0435 \u0441\u0442\u0430\u0440\u044b\u043c \u043a\u043b\u044e\u0447\u043e\u043c, \u043d\u0435\u0447\u0438\u0442\u0430\u0435\u043c\u044b\u043c\u0438! \u041d\u043e\u0432\u044b\u0435 \u043f\u0430\u0440\u043e\u043b\u0438 \u0431\u0443\u0434\u0443\u0442 \u0448\u0438\u0444\u0440\u043e\u0432\u0430\u0442\u044c\u0441\u044f \u043d\u043e\u0432\u044b\u043c \u043a\u043b\u044e\u0447\u043e\u043c (\u0435\u0441\u043b\u0438 \u0432\u044b\u0431\u0440\u0430\u043d \u043a\u043e\u0434\u0438\u0440\u043e\u0432\u0449\u0438\u043a \u0441\u0442\u0438\u043b\u044f <code>encrypted</code>). \u0423\u0431\u0435\u0434\u0438\u0442\u0435\u0441\u044c, \u0447\u0442\u043e \u0441\u043e\u0437\u0434\u0430\u043b\u0438 \u043d\u043e\u0432\u044b\u0435 \u0443\u0447\u0451\u0442\u043d\u044b\u0435 \u0434\u0430\u043d\u043d\u044b\u0435 \u0441 \u043d\u043e\u0432\u044b\u043c \u043a\u043b\u044e\u0447\u043e\u043c, \u0438\u043d\u0430\u0447\u0435 \u043c\u043e\u0436\u0435\u0442\u0435 \u0437\u0430\u0431\u043b\u043e\u043a\u0438\u0440\u043e\u0432\u0430\u0442\u044c \u0441\u0435\u0431\u044f!
