spring.web.resources.add-mappings=false
spring.main.banner-mode=off
server.error.includeStacktrace=ALWAYS
logging.level.root=WARN
logging.level.org.airsonic=WARN
logging.level.liquibase=WARN
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p){green} %clr(---){faint} %clr(%-40.40logger{32}){blue} %clr(:){faint} %m%n%wEx
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- %-40.40logger{32} : %m%n%wEx
spring.datasource.url=jdbc:hsqldb:mem:airsonic;hsqldb.tx=mvcc;sql.enforce_size=false;sql.char_literal=false;sql.nulls_first=false
spring.datasource.username=sa
spring.datasource.password=
spring.liquibase.change-log=classpath:liquibase/db-changelog.xml
# Boot 2.6+: дефолт сменился на PATH_PATTERN_PARSER, несовместимый с use-suffix-pattern.
# Сохраняем сопоставление старых REST-алиасов с суффиксом .view до удаления прежнего API.
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
