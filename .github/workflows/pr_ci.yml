name: 'PR CI (Gradle)'

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Build and test Kordinator
        run: >-
          gradle --no-daemon
          :kordinator-main:test :kordinator-main:shadowJar
          --tests 'KtorStandalone*Test' --tests 'Kordinator*Test'
          --tests 'RuntimeCompositionRoot*Test' --tests '*DaoTestCase'
          --tests 'JdbcHelperTest' --tests 'CoverArtServiceAccentColorTest'
          --tests 'LegacyDatabaseStartupTestCase' --tests 'MediaScannerService*Test*'
          --tests 'SettingsServiceTestCase' --tests 'TranscodingServiceIntTest'
          --tests 'MetaDataFactoryTestCase' --tests '*SearchService*TestCase'
          --tests 'IndexManagerTestCase' --tests 'QueryFactoryTestCase'
          --tests 'ScheduledTaskSnapshotTest' --tests 'PlaylistServiceHandlerOrderTest'
      - name: Start the packaged server
        run: |
          data_dir="$(mktemp -d)"
          java -jar kordinator-main/build/libs/kordinator.jar --kordinator.home="$data_dir" \
            --kordinator.http.host=127.0.0.1 --kordinator.http.port=8080 > "$data_dir/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" || true; rm -rf "$data_dir"' EXIT
          if ! curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/api/v1/health; then
            cat "$data_dir/server.log"
            exit 1
          fi
