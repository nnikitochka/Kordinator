name: 'PR CI (Maven)'

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Build and test Kordinator
        run: >-
          mvn -B -Dcheckstyle.skip=true -Dpmd.skip=true
          '-Dtest=KtorStandalone*Test,Kordinator*Test,RuntimeCompositionRoot*Test,*DaoTestCase,JdbcHelperTest,CoverArtServiceAccentColorTest,LegacyDatabaseStartupTestCase,MediaScannerService*Test*,SettingsServiceTestCase,TranscodingServiceIntTest,MetaDataFactoryTestCase,*SearchService*TestCase,IndexManagerTestCase,QueryFactoryTestCase,ScheduledTaskSnapshotTest,PlaylistServiceHandlerOrderTest'
          -Dsurefire.failIfNoSpecifiedTests=false package
      - name: Start the packaged server
        run: |
          data_dir="$(mktemp -d)"
          java -jar kordinator-main/target/kordinator.jar --kordinator.home="$data_dir" \
            --kordinator.http.host=127.0.0.1 --kordinator.http.port=8080 > "$data_dir/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" || true; rm -rf "$data_dir"' EXIT
          if ! curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/api/v1/health; then
            cat "$data_dir/server.log"
            exit 1
          fi
