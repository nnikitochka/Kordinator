name: 'Edge Deploy CI (Maven)'

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "github.repository == 'nnikitochka/Kordinator' && startsWith(github.event.head_commit.message, 'Merge pull request ')"
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: temurin
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Build with Maven
        run: >-
          mvn -B -Dcheckstyle.skip=true -Dpmd.skip=true
          '-Dtest=KtorStandalone*Test,Kordinator*Test,RuntimeCompositionRoot*Test,*DaoTestCase,JdbcHelperTest,CoverArtServiceAccentColorTest,LegacyDatabaseStartupTestCase,MediaScannerService*Test*,SettingsServiceTestCase,TranscodingServiceIntTest,MetaDataFactoryTestCase,*SearchService*TestCase,IndexManagerTestCase,QueryFactoryTestCase,ScheduledTaskSnapshotTest,PlaylistServiceHandlerOrderTest'
          -Dsurefire.failIfNoSpecifiedTests=false package
      - name: Calculate tags
        if: success()
        id: tagcalc
        run: |
          # Create tag
          ver=$(grep "version=" kordinator-main/target/generated/build-metadata/build.properties | cut -d"=" -f2);
          ts=$(grep "timestamp=" kordinator-main/target/generated/build-metadata/build.properties | cut -d"=" -f2);
          # Note this doesn't completely follow semver because docker tags do not take a + sign
          tag=$ver\.$ts;
          echo $tag;
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Deploy to GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tagcalc.outputs.tag }}
          name: Edge Release ${{ steps.tagcalc.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            kordinator-main/target/kordinator.jar
            kordinator-main/target/artifacts-checksums.sha
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p install/docker/target/dependency
      - run: cp kordinator-main/target/kordinator.jar install/docker/target/dependency/kordinator-main.jar
      - name: Build and push multiplatform images to Dockerhub
        uses: docker/build-push-action@v4
        with:
          file: install/docker/Dockerfile
          context: install/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nnikitochka/kordinator:latest
            nnikitochka/kordinator:edge-latest
            nnikitochka/kordinator:edge-${{ steps.tagcalc.outputs.tag }}
            nnikitochka/kordinator:gitcommit-${{ github.sha }}
            nnikitochka/kordinator:gitrun-${{ github.run_id }}
            ghcr.io/nnikitochka/Kordinator:latest
            ghcr.io/nnikitochka/Kordinator:edge-latest
            ghcr.io/nnikitochka/Kordinator:edge-${{ steps.tagcalc.outputs.tag }}
            ghcr.io/nnikitochka/Kordinator:gitcommit-${{ github.sha }}
            ghcr.io/nnikitochka/Kordinator:gitrun-${{ github.run_id }}
