name: 'Edge Deploy CI (Gradle)'

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "github.repository == 'nnikitochka/Kordinator' && startsWith(github.event.head_commit.message, 'Merge pull request ')"
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.0'
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v2
        with:
          install: true
      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}
      - name: Build with Gradle
        run: >-
          gradle --no-daemon
          :kordinator-main:test :kordinator-main:releaseArtifacts
          --tests 'KtorStandalone*Test' --tests 'Kordinator*Test'
          --tests 'RuntimeCompositionRoot*Test' --tests '*DaoTestCase'
          --tests 'JdbcHelperTest' --tests 'CoverArtServiceAccentColorTest'
          --tests 'LegacyDatabaseStartupTestCase' --tests 'MediaScannerService*Test*'
          --tests 'SettingsServiceTestCase' --tests 'TranscodingServiceIntTest'
          --tests 'MetaDataFactoryTestCase' --tests '*SearchService*TestCase'
          --tests 'IndexManagerTestCase' --tests 'QueryFactoryTestCase'
          --tests 'ScheduledTaskSnapshotTest' --tests 'PlaylistServiceHandlerOrderTest'
      - name: Calculate tags
        if: success()
        id: tagcalc
        run: |
          # Create tag
          ver=$(grep "version=" kordinator-main/build/generated/build-metadata/build.properties | cut -d"=" -f2);
          ts=$(grep "timestamp=" kordinator-main/build/generated/build-metadata/build.properties | cut -d"=" -f2);
          # Note this doesn't completely follow semver because docker tags do not take a + sign
          tag=$ver\.$ts;
          echo $tag;
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - name: Deploy to GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tagcalc.outputs.tag }}
          name: Edge Release ${{ steps.tagcalc.outputs.tag }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            kordinator-main/build/libs/kordinator.jar
            kordinator-main/build/artifacts-checksums.sha
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: mkdir -p install/docker/build/dependency
      - run: cp kordinator-main/build/libs/kordinator.jar install/docker/build/dependency/kordinator.jar
      - name: Build and push multiplatform images to Dockerhub
        uses: docker/build-push-action@v7
        with:
          file: install/docker/Dockerfile
          context: install/docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            nnikitochka/kordinator:latest
            nnikitochka/kordinator:edge-latest
            nnikitochka/kordinator:edge-${{ steps.tagcalc.outputs.tag }}
            nnikitochka/kordinator:gitcommit-${{ github.sha }}
            nnikitochka/kordinator:gitrun-${{ github.run_id }}
            ghcr.io/nnikitochka/Kordinator:latest
            ghcr.io/nnikitochka/Kordinator:edge-latest
            ghcr.io/nnikitochka/Kordinator:edge-${{ steps.tagcalc.outputs.tag }}
            ghcr.io/nnikitochka/Kordinator:gitcommit-${{ github.sha }}
            ghcr.io/nnikitochka/Kordinator:gitrun-${{ github.run_id }}
